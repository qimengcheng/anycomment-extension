<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 280px;
      margin: 0;
      font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 13px;
      color: #1f2430;
    }
    header {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 14px; background: #4f6ef7; color: #fff;
      font-weight: 700; font-size: 14px;
    }
    header img { width: 18px; height: 18px; }
    .body { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    label { display: flex; flex-direction: column; gap: 5px; color: #555c6e; }
    .switch-row { flex-direction: row; align-items: center; justify-content: space-between; }
    .switch-row input { width: 16px; height: 16px; }
    button {
      height: 32px; width: 100%; border-radius: 8px; border: 1px solid #e3e6f0;
      background: #fff; font: inherit; cursor: pointer;
    }
    button.primary { background: #4f6ef7; border-color: #4f6ef7; color: #fff; }
    button:hover { opacity: 0.9; }
    .hint { color: #8a90a5; font-size: 11px; line-height: 1.5; margin: 0; }
    .update-bar {
      display: none;
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 4px;
    }
    .update-bar.show { display: block; }
    .update-title { font-weight: 600; color: #4338ca; font-size: 13px; margin-bottom: 4px; }
    .update-desc { color: #6366f1; font-size: 11px; margin-bottom: 8px; }
    .update-actions { display: flex; gap: 8px; }
    .update-actions button { height: 28px; font-size: 12px; flex: 1; }
    .update-actions .primary { background: #4f6ef7; border-color: #4f6ef7; color: #fff; }
    .version-info { color: #b0b5c5; font-size: 10px; text-align: center; margin-top: 4px; }
    .version-info span { cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>
  <header><img src="icons/icon48.png" alt="" />AnyComment 网页评论</header>
  <div class="body">
    <div class="update-bar" id="updateBar">
      <div class="update-title">发现新版本 v<span id="latestVersion"></span></div>
      <div class="update-desc">当前版本 v<span id="currentVersion"></span>，点击下方按钮下载更新</div>
      <div class="update-actions">
        <button id="downloadUpdate" class="primary">下载更新</button>
        <button id="checkUpdateNow">检查更新</button>
      </div>
    </div>
    <label class="switch-row">
      <span>在网页上显示评论侧栏</span>
      <input type="checkbox" id="enabled" />
    </label>
    <button id="profile" class="primary">个人中心</button>
    <p class="hint">开关切换后自动保存，刷新网页即可生效。点击"个人中心"在新标签页查看自己的主页，未登录时会先进入登录页。</p>
    <div class="version-info">v<span id="versionText"></span> · <span id="checkLink">检查更新</span></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
